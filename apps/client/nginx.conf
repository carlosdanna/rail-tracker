# Serves the built client and forwards the server's endpoints to railsim.
# `server` is the service name from docker-compose.yml.
upstream railsim {
    server server:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The stream is a WebSocket, so the upgrade headers have to be forwarded.
    location /stream {
        proxy_pass http://railsim;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A quiet connection is still a live one: never time it out mid-stream.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location ~ ^/(world|metrics|healthz|config)$ {
        proxy_pass http://railsim;
        proxy_set_header Host $host;
    }
}
